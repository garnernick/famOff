<body>
<div id="dc-root"></div>
<script type="text/plain" id="dc-template">
<div style="font-family: 'Jost', system-ui, sans-serif; color: #1B2433; background: #F7F3EA">

<div style="background: #0E1A2E; color: #F7F3EA">
<div style="max-width: 1120px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px">
<a href="Home.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none">

<a href="Calendar.dc.html" style="text-decoration: none; color: #C9A96B; font-weight: 500">Calendar</a>

<a href="Home.dc.html#trips" style="text-decoration: none; color: #D9DEE8">Trips</a>
<a href="Account.dc.html" style="text-decoration: none; color: #D9DEE8">Account</a>

</div>
</div>

<div style="max-width: 1120px; margin: 0 auto; padding: 40px 24px 72px; display: flex; flex-direction: column; gap: 28px">
<h1 style="margin: 0; font-family: 'Cinzel', serif; font-weight: 500; font-size: 32px; color: #0E1A2E">Calendar</h1>
<div style="background: #FFFFFF; border: 1px solid #E3DCCB; border-radius: 12px; padding: 32px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #566070">December 2026. Dark days are confirmed trips, outlined days have an open quote.</p>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; font-size: 13px; color: #566070; text-align: center">
<span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="35">
<div onClick="{{d.pick}}" style="{{d.style}}">{{d.label}}</div>
</sc-for>
</div>
<sc-if value="{{showHint}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 14px; color: #566070">Select a highlighted day to see the trip or quote.</span>
</sc-if>
<sc-if value="{{vSummary}}" hint-placeholder-val="{{ false }}">
<div style="border: 1px solid #E3DCCB; border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px"><h3 style="margin: 0; font-size: 20px; font-weight: 600">{{detail.title}}</h3><span style="font-size: 13px; font-weight: 500; color: #7A5C24; background: #F1E7D0; border-radius: 20px; padding: 6px 12px">{{detail.chip}}</span></div>
<div style="display: flex; flex-direction: column"><sc-for list="{{detail.rows}}" as="r" hint-placeholder-count="5"><div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 10px 0; border-top: 1px solid #EFE9DA; font-size: 15px"><span style="color: #566070">{{r.k}}</span><span style="text-align: right">{{r.v}}</span></div></sc-for></div>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<sc-for list="{{detail.actions}}" as="a" hint-placeholder-count="2"><button onClick="{{a.go}}" style="{{a.style}}">{{a.label}}</button></sc-for>
<button onClick="{{closeDetail}}" style="min-height: 44px; padding: 0 16px; border: 0; background: transparent; color: #566070; font: inherit; font-size: 14px; cursor: pointer">Close</button>
</div>
</div>
</sc-if>

<sc-if value="{{vInvoice}}" hint-placeholder-val="{{ false }}">
<div style="border: 1px solid #E3DCCB; border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px"><h3 style="margin: 0; font-size: 20px; font-weight: 600">Invoice {{inv.no}}</h3><span style="font-size: 13px; font-weight: 500; color: #7A5C24; background: #F1E7D0; border-radius: 20px; padding: 6px 12px">{{inv.status}}</span></div>
<span style="font-size: 14px; color: #566070">{{invNote}}</span>
<div style="display: flex; flex-direction: column"><sc-for list="{{inv.rows}}" as="r" hint-placeholder-count="5"><div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 10px 0; border-top: 1px solid #EFE9DA; font-size: 15px"><span style="color: #566070">{{r.k}}</span><span style="text-align: right">{{r.v}}</span></div></sc-for></div>
<div style="display: flex; flex-wrap: wrap; gap: 12px"><button onClick="{{download}}" style="min-height: 44px; padding: 0 22px; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; border: 0; background: #0E1A2E; color: #F7F3EA">Download invoice (PDF) again</button></div>
<button onClick="{{back}}" style="min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: #7A5C24; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; align-self: flex-start">&larr; Back to trip</button>
</div>
</sc-if>

<sc-if value="{{vTrip}}" hint-placeholder-val="{{ false }}">
<div style="border: 1px solid #E3DCCB; border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px"><h3 style="margin: 0; font-size: 20px; font-weight: 600">{{detail.title}}</h3><span style="font-size: 13px; font-weight: 500; color: #7A5C24; background: #F1E7D0; border-radius: 20px; padding: 6px 12px">Full trip details</span></div>
<sc-for list="{{tripSections}}" as="sec" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column"><h4 style="margin: 14px 0 4px; font-family: 'Cinzel', serif; font-weight: 500; font-size: 17px; color: #0E1A2E">{{sec.h}}</h4>
<sc-for list="{{sec.rows}}" as="r" hint-placeholder-count="4"><div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 10px 0; border-top: 1px solid #EFE9DA; font-size: 15px"><span style="color: #566070">{{r.k}}</span><span style="text-align: right">{{r.v}}</span></div></sc-for></div>
</sc-for>
<button onClick="{{back}}" style="min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: #7A5C24; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; align-self: flex-start">&larr; Back to trip</button>
</div>
</sc-if>

<sc-if value="{{vQuote}}" hint-placeholder-val="{{ false }}">
<div style="border: 1px solid #E3DCCB; border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px"><h3 style="margin: 0; font-size: 20px; font-weight: 600">{{detail.title}}</h3><span style="font-size: 13px; font-weight: 500; color: #7A5C24; background: #F1E7D0; border-radius: 20px; padding: 6px 12px">Awaiting your decision</span></div>
<span style="font-size: 14px; color: #566070">{{quoteIntro}}</span>
<sc-for list="{{quoteOpts}}" as="q" hint-placeholder-count="3">
<div style="{{q.box}}">
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17px; font-weight: 600">{{q.name}}</span><span style="font-size: 14px; color: #566070">{{q.sub}}</span></div>
<div style="display: flex; align-items: center; gap: 16px"><span style="font-size: 20px; font-weight: 600">{{q.price}}</span><button onClick="{{q.pick}}" style="{{q.btn}}">{{q.label}}</button></div>
</div>
</sc-for>
<sc-if value="{{quoteDone}}" hint-placeholder-val="{{ false }}"><div style="background: #F1E7D0; border-radius: 8px; padding: 14px 16px; font-size: 15px; color: #1B2433">{{quoteMsg}}</div></sc-if>
<button onClick="{{back}}" style="min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: #7A5C24; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; align-self: flex-start">&larr; Back to trip</button>
</div>
</sc-if>

<sc-if value="{{vAsk}}" hint-placeholder-val="{{ false }}">
<div style="border: 1px solid #E3DCCB; border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px"><h3 style="margin: 0; font-size: 20px; font-weight: 600">Ask a question</h3><span style="font-size: 13px; font-weight: 500; color: #7A5C24; background: #F1E7D0; border-radius: 20px; padding: 6px 12px">{{detail.title}}</span></div>
<span style="font-size: 14px; color: #566070">Goes straight to {{contact}}.</span>
<textarea rows="4" placeholder="Your question, for example catering, baggage or timings" style="box-sizing: border-box; width: 100%; padding: 12px 14px; border: 1px solid #CFC7B3; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 16px; color: #1B2433; resize: vertical"></textarea>
<div style="display: flex; flex-wrap: wrap; gap: 12px"><button onClick="{{send}}" style="min-height: 44px; padding: 0 22px; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; border: 0; background: #0E1A2E; color: #F7F3EA">Send question</button></div>
<sc-if value="{{asked}}" hint-placeholder-val="{{ false }}"><div style="background: #F1E7D0; border-radius: 8px; padding: 14px 16px; font-size: 15px">Sent to {{contact}}. You will hear back within 2 working hours.</div></sc-if>
<button onClick="{{back}}" style="min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: #7A5C24; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; align-self: flex-start">&larr; Back to trip</button>
</div>
</sc-if>

<sc-if value="{{vRequest}}" hint-placeholder-val="{{ false }}">
<div style="border: 1px solid #E3DCCB; border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px"><h3 style="margin: 0; font-size: 20px; font-weight: 600">{{detail.title}}</h3><span style="font-size: 13px; font-weight: 500; color: #7A5C24; background: #F1E7D0; border-radius: 20px; padding: 6px 12px">Quotes being prepared</span></div>
<div style="display: flex; flex-direction: column"><sc-for list="{{detail.rows}}" as="r" hint-placeholder-count="5"><div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 10px 0; border-top: 1px solid #EFE9DA; font-size: 15px"><span style="color: #566070">{{r.k}}</span><span style="text-align: right">{{r.v}}</span></div></sc-for></div>
<h4 style="margin: 14px 0 0; font-family: 'Cinzel', serif; font-weight: 500; font-size: 17px; color: #0E1A2E">Progress</h4>
<div style="display: flex; flex-direction: column"><sc-for list="{{timeline}}" as="r" hint-placeholder-count="5"><div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 10px 0; border-top: 1px solid #EFE9DA; font-size: 15px"><span style="color: #566070">{{r.k}}</span><span style="text-align: right">{{r.v}}</span></div></sc-for></div>
<button onClick="{{back}}" style="min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: #7A5C24; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; align-self: flex-start">&larr; Back to trip</button>
</div>
</sc-if>
</div>
</div>
</div>
</div>
</script>

const details = {

actions: [{ label: 'Review quote', style: pri, go: 'quote' }, { label: 'Ask a question', style: sec2, go: 'ask' }] }
};
const day = this.state.day;
const dd = details[day];
const view = this.state.view;
const pdf = (lines) => {
const esc = (s) => String(s).replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
let y = 790;
let content = 'BT /F1 18 Tf 50 ' + y + ' Td (' + esc(lines[0]) + ') Tj ET\n';
lines.slice(1).forEach((l) => { y -= 24; content += 'BT /F1 12 Tf 50 ' + y + ' Td (' + esc(l) + ') Tj ET\n'; });
const objs = ['<< /Type /Catalog /Pages 2 0 R >>', '<< /Type /Pages /Kids [3 0 R] /Count 1 >>', '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>', '<< /Length ' + content.length + ' >>\nstream\n' + content + 'endstream', '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'];
let out = '%PDF-1.4\n';
const offs = [];
objs.forEach((o, i) => { offs.push(out.length); out += (i + 1) + ' 0 obj\n' + o + '\nendobj\n'; });
const xr = out.length;
out += 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n' + offs.map((o) => String(o).padStart(10, '0') + ' 00000 n \n').join('') + 'trailer\n<< /Size ' + (objs.length + 1) + ' /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF';
return new Blob([out], { type: 'application/pdf' });
};
const doDownload = () => {
if (!dd || !dd.inv) return;
const lines = ['VoleAlti - Invoice ' + dd.inv.no, 'Sample invoice, mock data for demonstration only', ''].concat(dd.inv.rows.map((r) => r.k + ': ' + r.v));
try {
const a = document.createElement('a');
a.href = URL.createObjectURL(pdf(lines));
a.download = dd.inv.no + '.pdf';
document.body.appendChild(a);
a.click();
a.remove();
} catch (e) {}
};
for (let n = 1; n <= 31; n++) {
let st ='min-height: 56px; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 1px solid #EFE9DA; font-size: 14px; color: #1B2433';
if (trips.includes(n)) st = 'min-height: 56px; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 1px solid #0E1A2E; background: #0E1A2E; font-size: 14px; color: #F7F3EA; font-weight: 600';
if (quotes.includes(n)) st = 'min-height: 56px; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 2px solid #7A5C24; font-size: 14px; color: #7A5C24; font-weight: 600';
if (details[n]) st += '; cursor: pointer';
if (this.state.day === n) st += '; box-shadow: 0 0 0 3px #C9A96B';
days.push({ label: String(n), style: st, pick: () => { if (details[n]) this.setState({ day: n, view: 'summary', asked: false }); } });
}
const picked = (this.state.picks[day] || '');
const optBox = 'border: 1px solid #E3DCCB; border-radius: 8px; padding: 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px';
const quoteOpts = dd && dd.opts ? dd.opts.map((o) => ({
name: o.name, sub: o.sub, price: o.price,
box: picked === o.id ? optBox + '; border: 2px solid #7A5C24; background: #FBF6EA' : optBox,
btn: picked === o.id ? 'min-height: 44px; padding: 0 20px; border: 0; border-radius: 6px; background: #7A5C24; color: #FFFFFF; font: inherit; font-weight: 600; cursor: default' : 'min-height: 44px; padding: 0 20px; border: 0; border-radius: 6px; background: #0E1A2E; color: #F7F3EA; font: inherit; font-weight: 600; cursor: pointer',
label: picked === o.id ? 'Accepted' : 'Accept quote',
pick: () => this.setState({ picks: { ...this.state.picks, [day]: o.id } })
})) : [];
const chosen = dd && dd.opts ? dd.opts.find((o) => o.id === picked) : null;
const withGo = dd ? dd.actions.map((a) => ({ label: a.label, style: a.style, go: a.go === 'download' ? () => { doDownload(); this.setState({ view: 'invoice' }); } : go(a.go) })) : [];
return {
detail: dd ? { title: dd.title, chip: dd.chip, rows: dd.rows, actions: withGo } : { title: '', chip: '', rows: [], actions: [] },
showDetail: !!dd,
showHint: !dd,
vSummary: !!dd && view === 'summary',
vInvoice: !!dd && view === 'invoice' && !!dd.inv,
vTrip: !!dd && view === 'trip' && !!dd.sections,
vQuote: !!dd && view === 'quote' && !!dd.opts,
vAsk: !!dd && view === 'ask',
vRequest: !!dd && view === 'request',
inv: dd && dd.inv ? dd.inv : { no: '', status: '', rows: [] },
invNote: 'Your PDF has been downloaded. Sample invoice with mock data.',
download: doDownload,
tripSections: dd && dd.sections ? dd.sections : [],
quoteIntro: dd && dd.quoteIntro ? dd.quoteIntro : '',
quoteOpts,
quoteDone: !!chosen,
quoteMsg: chosen ? 'Quote accepted: ' + chosen.name + ' at ' + chosen.price + '. Sophie Hartley will confirm within 2 working hours and send your invoice.' : '',
contact,
asked: this.state.asked,
send: () => this.setState({ asked: true }),
timeline: dd && dd.timeline ? dd.timeline : [],
back: () => this.setState({ view: 'summary', asked: false }),
closeDetail: () => this.setState({ day: null, view: 'summary', asked: false }),
days
};
}
}
</script>
<script src="./dc-lite.js"></script>
