<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>EA Portal home</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F3EA}
input.dt{-webkit-appearance:none;appearance:none;width:100%;max-width:100%;min-width:0;display:block;box-sizing:border-box;height:48px}
input.dt::-webkit-date-and-time-value{text-align:left;margin:0;min-height:1.2em}
@media (pointer:coarse){input.dt.empty::-webkit-datetime-edit{opacity:0}.dph{display:block !important}}
@media (max-width: 640px){.svc{flex:1 1 100%;flex-wrap:nowrap !important;overflow-x:auto;margin:0 -28px;padding:2px 28px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.svc::-webkit-scrollbar{display:none}.svc button{flex:none;white-space:nowrap}.seg{flex-wrap:nowrap !important}.seg button{flex:1 1 0;padding:0 6px !important;white-space:nowrap}.fld{min-width:0}.hamb{display:inline-flex !important;align-items:center;justify-content:center;width:44px;height:44px;cursor:pointer;margin-right:-10px}.mainnav{display:none !important;flex:1 1 100%;flex-direction:column;align-items:stretch !important;gap:0 !important;border-top:1px solid #24324C}.navtoggle:checked ~ .mainnav{display:flex !important}.mainnav a{display:flex;align-items:center;min-height:48px;padding:0 4px;border-bottom:1px solid #1B2A44}.mainnav a[href="Main.dc.html"]{justify-content:center;margin:14px 0 4px;border:1px solid #3A4966 !important}.fld{flex:1 1 100% !important}.snav{flex:1 1 100% !important;flex-direction:row !important;overflow-x:auto;gap:6px !important}.snav button{flex:none;white-space:nowrap;padding:0 12px !important;font-size:15px !important}.ovwrap{padding:16px !important}.ovcard{padding:20px !important;max-height:calc(100vh - 32px) !important}}
input[type=date],input[type=datetime-local]{color-scheme:light}
input[type=date]::-webkit-datetime-edit,input[type=date]::-webkit-datetime-edit-fields-wrapper,input[type=date]::-webkit-datetime-edit-text,input[type=date]::-webkit-datetime-edit-day-field,input[type=date]::-webkit-datetime-edit-month-field,input[type=date]::-webkit-datetime-edit-year-field,input[type=datetime-local]::-webkit-datetime-edit,input[type=datetime-local]::-webkit-datetime-edit-fields-wrapper,input[type=datetime-local]::-webkit-datetime-edit-text,input[type=datetime-local]::-webkit-datetime-edit-day-field,input[type=datetime-local]::-webkit-datetime-edit-month-field,input[type=datetime-local]::-webkit-datetime-edit-year-field,input[type=datetime-local]::-webkit-datetime-edit-hour-field,input[type=datetime-local]::-webkit-datetime-edit-minute-field{color:inherit}
input[type=date]::-webkit-calendar-picker-indicator,input[type=datetime-local]::-webkit-calendar-picker-indicator{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer}
a{color:inherit}
</style>

<script src="./airports-data.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/plain" id="dc-template">
<div style="font-family: 'Jost', system-ui, sans-serif; color: #1B2433; background: #F7F3EA">

<div style="background: #0E1A2E; color: #F7F3EA">
<div style="max-width: 1120px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px">
<a href="Home.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none">
<svg width="36" height="36" viewBox="0 0 40 40" role="img" aria-label="VoleAlti monogram"><circle cx="20" cy="20" r="18" fill="none" stroke="#C9A96B" stroke-width="1.5"/><text x="20" y="25" text-anchor="middle" font-family="Cinzel, serif" font-size="14" font-weight="600" fill="#C9A96B">VA</text></svg>
<span style="font-family: 'Cinzel', serif; font-size: 18px; letter-spacing: 0.14em">VOLEALTI</span>
</a>
<input type="checkbox" id="navtoggle" class="navtoggle" aria-label="Menu" style="position: absolute; opacity: 0; width: 1px; height: 1px">
<label for="navtoggle" class="hamb" style="display: none" aria-label="Open menu"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F7F3EA" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></label>
<nav class="mainnav" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 26px; font-size: 15px">
<a href="Home.dc.html" style="text-decoration: none; color: #C9A96B; font-weight: 500">Home</a>
<a href="Calendar.dc.html" style="text-decoration: none; color: #D9DEE8">Calendar</a>
<a href="#search" style="text-decoration: none; color: #D9DEE8">Search</a>
<a href="#trips" style="text-decoration: none; color: #D9DEE8">Trips</a>
<a href="Account.dc.html" style="text-decoration: none; color: #D9DEE8">Account</a>
<a href="Main.dc.html" style="text-decoration: none; color: #B9C2D2; font-size: 14px; border: 1px solid #3A4966; border-radius: 6px; padding: 10px 14px">Sign out</a>
</nav>
</div>
</div>

<div style="max-width: 1120px; margin: 0 auto; padding: 40px 24px 72px; display: flex; flex-direction: column; gap: 36px">

<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Cinzel', serif; font-weight: 500; font-size: 32px; color: #0E1A2E">{{greeting}}</h1>
<span style="font-size: 16px; color: #566070">Here is what needs you today.</span>
</div>
<span style="font-size: 13px; color: #566070; border: 1px dashed #CFC7B3; border-radius: 6px; padding: 8px 12px">Draft with sample content</span>
</div>

<div id="search" style="background: #FFFFFF; border: 1px solid #E3DCCB; border-radius: 12px; padding: 28px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<h2 style="margin: 0; font-family: 'Cinzel', serif; font-weight: 500; font-size: 22px; color: #0E1A2E">Search</h2>
<div class="svc" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
</div>
<sc-if value="{{showSoon}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #1B2433">Coming soon. Feel free to <a href="mailto:cp@volealti.com" style="color: #7A5C24; text-decoration: none; border-bottom: 1px solid #C9A96B">email us</a> in the meantime.</p>
</sc-if>
<sc-if value="{{showForm}}" hint-placeholder-val="{{ true }}">
<sc-if value="{{showTrip}}" hint-placeholder-val="{{ true }}">
<div class="seg" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tripTypes}}" as="tt" hint-placeholder-count="3">
<button onClick="{{tt.pick}}" style="{{tt.style}}">{{tt.label}}</button>
</sc-for>
</div>
</sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end">
<sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
<sc-if value="{{f.isBreak}}" hint-placeholder-val="{{ false }}"><div style="flex: 0 0 100%; height: 0"></div></sc-if>
<sc-if value="{{f.isField}}" hint-placeholder-val="{{ true }}"><label class="fld" style="{{f.lstyle}}">{{f.label}}<sc-if value="{{f.isText}}" hint-placeholder-val="{{ true }}"><input type="text" autocomplete="off" value="{{f.value}}" placeholder="{{f.ph}}" onInput="{{f.input}}" onFocus="{{f.focus}}" onBlur="{{f.blur}}" style="box-sizing: border-box; min-height: 48px; padding: 0 14px; border: 1px solid #CFC7B3; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 16px; color: #1B2433"></sc-if>
<sc-if value="{{f.isNum}}" hint-placeholder-val="{{ false }}"><span style="position: relative; display: block"><input type="text" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="{{f.label}} (1 to 16)" value="{{f.numValue}}" placeholder="1" onInput="{{f.input}}" style="box-sizing: border-box; width: 100%; min-height: 48px; padding: 0 40px 0 14px; border: 1px solid #CFC7B3; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 16px; color: #1B2433"><button type="button" onClick="{{f.numUp}}" aria-label="Add a passenger" style="position: absolute; right: 6px; top: 4px; width: 28px; height: 20px; padding: 0; border: 0; background: transparent; color: #7A5C24; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button><button type="button" onClick="{{f.numDown}}" aria-label="Remove a passenger" style="position: absolute; right: 6px; bottom: 4px; width: 28px; height: 20px; padding: 0; border: 0; background: transparent; color: #7A5C24; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></span></sc-if>
<sc-if value="{{f.isSelect}}" hint-placeholder-val="{{ false }}"><select aria-label="{{f.label}}" onChange="{{f.input}}" style="{{f.sstyle}}">
<sc-for list="{{f.choices}}" as="c" hint-placeholder-count="4">
<option value="{{c.v}}" selected="{{c.sel}}">{{c.v}}</option>
</sc-for>
</select></sc-if>
<sc-if value="{{f.isDate}}" hint-placeholder-val="{{ false }}"><span style="position: relative; display: block"><input class="{{f.dcls}}" type="{{f.dtype}}" value="{{f.value}}" onInput="{{f.input}}" aria-label="{{f.label}}" style="{{f.dstyle}}"><sc-if value="{{f.dempty}}" hint-placeholder-val="{{ false }}"><span class="dph" aria-hidden="true" style="display: none; position: absolute; left: 14px; top: 0; line-height: 48px; font-size: 16px; color: #757575; pointer-events: none">Select date</span></sc-if><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A5C24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 14px; top: 14px; pointer-events: none"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span></sc-if>
<sc-if value="{{f.showList}}" hint-placeholder-val="{{ false }}">
<div role="listbox" style="position: absolute; z-index: 5; top: 82px; left: 0; right: 0; min-width: 260px; background: #FFFFFF; border: 1px solid #CFC7B3; border-radius: 6px; box-shadow: 0 8px 24px rgba(14,26,46,0.12); overflow: hidden">
<sc-for list="{{f.options}}" as="o" hint-placeholder-count="4">
<div role="option" onMouseDown="{{o.pick}}" style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; min-height: 44px; box-sizing: border-box; padding: 10px 14px; border-bottom: 1px solid #F1EBDD; cursor: pointer"><span style="display: flex; flex-direction: column; gap: 2px; font-size: 15px; color: #1B2433">{{o.title}}<span style="font-size: 12px; color: #566070">{{o.sub}}</span></span><span style="font-size: 12px; letter-spacing: 0.06em; color: #7A5C24; white-space: nowrap">{{o.codes}}</span></div>
</sc-for>
</div>
</sc-if>
</label></sc-if>
</sc-for>
</div>
<sc-if value="{{showLegRow}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px"><sc-if value="{{showAddLeg}}" hint-placeholder-val="{{ true }}"><button onClick="{{addLeg}}" style="min-height: 44px; padding: 0; border: 0; background: transparent; color: #7A5C24; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">+ Add another leg</button></sc-if><sc-if value="{{canRemoveLeg}}" hint-placeholder-val="{{ false }}"><button onClick="{{removeLeg}}" style="min-height: 44px; padding: 0; border: 0; background: transparent; color: #566070; font: inherit; font-size: 14px; cursor: pointer">Remove leg</button></sc-if><sc-if value="{{atLegLimit}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; color: #7A5C24">Leg Limit Reached - please email us and we'll call you to discuss this further.</span></sc-if></div>
</sc-if>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #566070">Additional requirements / special requests<textarea rows="3" placeholder="Anything we should know, such as catering, pets or a must-have feature" style="box-sizing: border-box; width: 100%; padding: 12px 14px; border: 1px solid #CFC7B3; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 16px; color: #1B2433; resize: vertical"></textarea></label>
<div><a href="{{findHref}}" style="display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; min-height: 48px; padding: 0 32px; border-radius: 6px; background: #0E1A2E; color: #F7F3EA; font-weight: 600; font-size: 16px; text-decoration: none">{{findLabel}}</a></div><sc-if value="{{showTrip}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 13px; color: #566070">More than 16 passengers? <a href="mailto:info@volealti.com?subject=Charter%20for%20more%20than%2016%20passengers" style="color: #7A5C24; text-decoration: none; border-bottom: 1px solid #C9A96B">Message us here.</a></span>
</sc-if>
</sc-if>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">

<div style="flex: 1 1 480px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
<button onClick="{{toggleQ}}" style="display: inline-flex; align-items: baseline; gap: 10px; padding: 0; border: 0; background: transparent; cursor: pointer; text-align: left"><sc-if value="{{qOpen}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#7A5C24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; align-self: center"><path d="M3 6l5 5 5-5"/></svg></sc-if><sc-if value="{{qClosed}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#7A5C24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; align-self: center"><path d="M6 3l5 5-5 5"/></svg></sc-if><h2 style="margin: 0; font-family: 'Cinzel', serif; font-weight: 500; font-size: 22px; color: #0E1A2E">Quotes open</h2></button>
</div>
<sc-if value="{{qOpen}}" hint-placeholder-val="{{ false }}">
<div style="background: #FFFFFF; border: 1px solid #E3DCCB; border-radius: 10px; padding: 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17px; font-weight: 600">Farnborough to Nice</span><span style="font-size: 14px; color: #566070">Fri 12 Dec, 4 passengers · held until [time]</span></div>
<div style="display: flex; align-items: center; gap: 14px"><span style="font-size: 13px; font-weight: 500; color: #7A5C24; background: #F1E7D0; border-radius: 20px; padding: 6px 12px">Awaiting your decision</span><button onClick="{{openQ12}}" style="padding: 0; border: 0; background: transparent; font: inherit; cursor: pointer; font-size: 14px; color: #0E1A2E; font-weight: 600">Review</button></div>
</div>
<div style="background: #FFFFFF; border: 1px solid #E3DCCB; border-radius: 10px; padding: 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17px; font-weight: 600">Teterboro to Luton</span><span style="font-size: 14px; color: #566070">Tue 16 Dec, 2 passengers</span></div>
<div style="display: flex; align-items: center; gap: 14px"><span style="font-size: 13px; font-weight: 500; color: #566070; background: #ECE8DD; border-radius: 20px; padding: 6px 12px">Quotes being prepared</span><button onClick="{{openQ16}}" style="padding: 0; border: 0; background: transparent; font: inherit; cursor: pointer; font-size: 14px; color: #0E1A2E; font-weight: 600">View</button></div>
</div>
<div style="background: #FFFFFF; border: 1px solid #E3DCCB; border-radius: 10px; padding: 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17px; font-weight: 600">Luton to Geneva</span><span style="font-size: 14px; color: #566070">Sat 20 Dec, 6 passengers · held until [time]</span></div>
<div style="display: flex; align-items: center; gap: 14px"><span style="font-size: 13px; font-weight: 500; color: #7A5C24; background: #F1E7D0; border-radius: 20px; padding: 6px 12px">Awaiting your decision</span><button onClick="{{openQ20}}" style="padding: 0; border: 0; background: transparent; font: inherit; cursor: pointer; font-size: 14px; color: #0E1A2E; font-weight: 600">Review</button></div>
</div>
</sc-if>
</div>

<div id="trips" style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
<button onClick="{{toggleT}}" style="display: inline-flex; align-items: baseline; gap: 10px; padding: 0; border: 0; background: transparent; cursor: pointer; text-align: left"><sc-if value="{{tOpen}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#7A5C24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; align-self: center"><path d="M3 6l5 5 5-5"/></svg></sc-if><sc-if value="{{tClosed}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#7A5C24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; align-self: center"><path d="M6 3l5 5-5 5"/></svg></sc-if><h2 style="margin: 0; font-family: 'Cinzel', serif; font-weight: 500; font-size: 22px; color: #0E1A2E">Upcoming trips</h2></button>
</div>
<sc-if value="{{tOpen}}" hint-placeholder-val="{{ false }}">
<div style="background: #0E1A2E; color: #F7F3EA; border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; letter-spacing: 0.12em; color: #C9A96B">FRI 5 DEC</span>
<span style="font-size: 18px; font-weight: 600">Luton to Geneva</span>
<span style="font-size: 14px; color: #B9C2D2">Confirmed, departs 09:30</span>
<span style="font-size: 14px; color: #B9C2D2">Your contact: [Name], [direct line]</span>
<button onClick="{{openT5}}" style="align-self: flex-start; text-align: left; padding: 0; border: 0; background: transparent; font: inherit; cursor: pointer; margin-top: 8px; font-size: 14px; color: #C9A96B; font-weight: 500">Trip details</button>
</div>
<div style="background: #FFFFFF; border: 1px solid #E3DCCB; border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; letter-spacing: 0.12em; color: #7A5C24">TUE 9 DEC</span>
<span style="font-size: 18px; font-weight: 600">Geneva to Luton</span>
<span style="font-size: 14px; color: #566070">Confirmed, departs 17:00</span>
<span style="font-size: 14px; color: #566070">Your contact: [Name], [direct line]</span>
<button onClick="{{openT9}}" style="align-self: flex-start; text-align: left; padding: 0; border: 0; background: transparent; font: inherit; cursor: pointer; margin-top: 8px; font-size: 14px; color: #0E1A2E; font-weight: 500">Trip details</button>
</div>
</sc-if>
</div>

</div>
</div>

<sc-if value="{{ovShow}}" hint-placeholder-val="{{ false }}">
<div class="ovwrap" onClick="{{ovBackdrop}}" style="position: fixed; inset: 0; z-index: 50; background: rgba(14,26,46,0.55); display: flex; align-items: flex-start; justify-content: center; padding: 60px 20px 20px; box-sizing: border-box">
<div class="ovcard" role="dialog" aria-modal="true" style="background: #FFFFFF; border-radius: 12px; width: 100%; max-width: 640px; max-height: calc(100vh - 120px); overflow: auto; padding: 28px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box; box-shadow: 0 20px 60px rgba(14,26,46,0.35)">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px"><div style="display: flex; flex-direction: column; gap: 8px"><h3 style="margin: 0; font-family: 'Cinzel', serif; font-weight: 500; font-size: 22px; color: #0E1A2E">{{ov.title}}</h3><span style="font-size: 13px; font-weight: 500; color: #7A5C24; background: #F1E7D0; border-radius: 20px; padding: 6px 12px; align-self: flex-start">{{ov.chip}}</span></div>
<button onClick="{{ovClose}}" aria-label="Close" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: #F1ECDD; color: #1B2433; font: inherit; font-size: 20px; line-height: 1; cursor: pointer">&times;</button></div>
<sc-if value="{{ovQuote}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 14px; color: #566070">{{ov.intro}}</span>
<sc-for list="{{ovOpts}}" as="q" hint-placeholder-count="3">
<div style="{{q.box}}"><div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17px; font-weight: 600">{{q.name}}</span><span style="font-size: 14px; color: #566070">{{q.sub}}</span></div>
<div style="display: flex; align-items: center; gap: 16px"><span style="font-size: 20px; font-weight: 600">{{q.price}}</span><button onClick="{{q.pick}}" style="{{q.btn}}">{{q.label}}</button></div></div>
</sc-for>
<sc-if value="{{ovDone}}" hint-placeholder-val="{{ false }}"><div style="background: #F1E7D0; border-radius: 8px; padding: 14px 16px; font-size: 15px">{{ovMsg}}</div></sc-if>
</sc-if>
<sc-if value="{{ovRequest}}" hint-placeholder-val="{{ false }}">
<sc-for list="{{ov.rows}}" as="r" hint-placeholder-count="5"><div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 10px 0; border-top: 1px solid #EFE9DA; font-size: 15px"><span style="color: #566070">{{r.k}}</span><span style="text-align: right">{{r.v}}</span></div></sc-for>
<h4 style="margin: 14px 0 0; font-family: 'Cinzel', serif; font-weight: 500; font-size: 17px; color: #0E1A2E">Progress</h4>
