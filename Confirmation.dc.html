<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
renderVals() {
const fmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
let need = 120;
let t = Date.now();
t -= t % 60000;
let guard = 0;
while (need > 0 && guard++ < 20000) {
t += 60000;
const p = fmt.formatToParts(new Date(t));
const day = p.find((x) => x.type === 'weekday').value;
const mins = +p.find((x) => x.type === 'hour').value * 60 + +p.find((x) => x.type === 'minute').value;
if (day !== 'Sat' && day !== 'Sun' && mins > 540 && mins <= 1050) need--;
}
const due = new Date(t).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZoneName: 'short' });
return { due };
}
}
